name: Build eKasa beta APK

on:
  push:
    branches:
      - ekasa-beta-apk
    paths:
      - 'ekasa-beta/**'
      - '.github/workflows/ekasa-beta-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: ekasa-beta
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare named APK
        run: |
          mkdir -p release
          cp ekasa-beta/app/build/outputs/apk/debug/app-debug.apk release/eKasa-Skener-BETA-0.2.0.apk
          sha256sum release/eKasa-Skener-BETA-0.2.0.apk > release/SHA256.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ekasa-skener-beta-apk
          path: release/
          if-no-files-found: error
          retention-days: 14
